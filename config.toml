baseURL                          = "https://neilthakral.github.io/"     # Your domain name. Must end with "/"
theme                            = "introduction"
DefaultContentLanguage           = "en"                   # Default language for multilingual sites
# disqusshortname                = ""                     # https://gohugo.io/content-management/comments
googleAnalytics                  = "G-1NZS7SWBW9"       # https://gohugo.io/templates/internal/#google-analytics
enableRobotsTXT                  = true

[params]
    themeStyle                   = "light"                 # Choose "light" or "dark" or "auto"
    favicon                      = "/img/brown.ico"     # Path to favicon file
    showRSSButton                = false                   # Show rss button in navigation
    fadeIn                       = false                   # Turn on/off the fade-in effect
    fadeInIndex                  = false                   # Turn on/off the fade-in effect on the index page even if fade-in was otherwise turned off
    dateFormat                   = "Jan 2, 2006"
    email                        = "neil_thakral@brown.edu"          # E-mail address for contact section
    customCSS                    = ["css/custom.css", "css/academicons.css", "css/topbutton.css", "css/calendly.css"]               # Include custom css files placed under assets/
    customJS                     = ["js/custom.js", "js/calendly.js"]  # Include custom JS files placed under assets/

    # Configure the home page
    [params.home]
        introHeight              = "medium"                # Input either "medium" or "large" or "fullheight"
        showLatest               = true                    # Show latest blog post summary
        showAllPosts             = false                   # Set true to list all posts on home page, or set false to link to separate blog list page
        numberOfProjectsToShow   = 3                       # Maximum number of projects to show on home page. Unset or comment out to show all projects

        localTime                = true                    # Show your current local time in contact section
        timeZone                 = "America/New_York"   # Your timezone as in the TZ* column of this list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
        timeFormat               = "h:mm A"                # https://momentjs.com/docs/#/displaying/format/
    [params.projects]
        useTwoColumns            = false                   # Use a layout with two columns instead of three

    # Share buttons on blog post pages
    [params.share]
        twitter                  = true
        facebook                 = false
        googlePlus               = false
        pinterest                = false

    # Social icons appear in introduction and contact section. Add as many more as you like.
    # Icon pack "fab" includes social network icons, see: https://fontawesome.com/cheatsheet/free/brands
    # Icon pack "fas" includes solid style icons, see: https://fontawesome.com/cheatsheet/free/solid

# If you don't want to use the default menu, you can define one by yourself
[[menu.main]]
    name    = "Research"
    url     = "/#research"
    weight  = 1

[[menu.main]]
    name    = "CV"
    url     = "/cv"
    weight  = 2

[[menu.main]]
    name    = "Media"
    url     = "/media"
    weight  = 4

# We only use tag as a taxonomies
# You can add more by yourself
[taxonomies]
  tag = "tags"

[languages]
    [languages.en]
        label            = "English"
        locale           = "en-us"
        contentDir       = "content/en"
        weight           = 0
        title            = "Neil Thakral"
        [languages.en.params]
            description  = "Assistant Professor, Brown University"   # Max 160 characters show in search results
            footerText   = "&copy; 2022 [Neil Thakral](https://neilthakral.github.io)" # Text to override default footer text (markdown allowed)

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    # For styles, see https://xyproto.github.io/splash/docs/longer/all.html
    style = "friendly"
    tabWidth = 4
